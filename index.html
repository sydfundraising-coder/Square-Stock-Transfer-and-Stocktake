<style>

    --good:#43c46f;--good-soft:#123020;--warn:#e39b3c;--warn-soft:#31240f;--crit:#f0645d;--crit-soft:#3a1512;
    --transit:#9b83ef;--transit-soft:#231a45;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);--shadow-lg:0 10px 46px rgba(0,0,0,.6);}}
  :root[data-theme="dark"]{
    --bg:#0d1218;--surface:#151d26;--surface-2:#1b2530;--ink:#e7eef4;--muted:#9db0bf;--faint:#6d7f8d;
    --border:#25303b;--border-strong:#324150;--accent:#33b3a8;--accent-soft:#123832;--accent-ink:#8fe0d7;
    --good:#43c46f;--good-soft:#123020;--warn:#e39b3c;--warn-soft:#31240f;--crit:#f0645d;--crit-soft:#3a1512;
    --transit:#9b83ef;--transit-soft:#231a45;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);--shadow-lg:0 10px 46px rgba(0,0,0,.6);}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

  .app{display:grid;grid-template-columns:248px 1fr;height:100%}
  .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}

  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--disp);font-size:13px}
  .theme-btn,.signout{background:none;border:1px solid var(--border);border-radius:9px;padding:7px;color:var(--muted);display:grid;place-items:center}

  .btn:hover{background:var(--surface-2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{filter:brightness(1.06)}

  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}tr:last-child td{border-bottom:0}
  tbody tr.clickable{cursor:pointer}tbody tr.clickable:hover{background:var(--surface-2)}th.num,td.num{text-align:right}

  .p-transit{background:var(--transit-soft);color:var(--transit)}.p-partial{background:var(--warn-soft);color:var(--warn)}.p-done{background:var(--good-soft);color:var(--good)}.p-cancel{background:var(--crit-soft);color:var(--crit)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);font-size:11.5px;color:var(--muted);font-weight:600}
  .empty{text-align:center;padding:46px 20px;color:var(--faint)}.empty svg{width:38px;height:38px;opacity:.5;margin-bottom:10px}
  .field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hint{font-size:11.5px;color:var(--faint);margin-top:5px}
  .scrim{position:fixed;inset:0;background:rgba(10,15,20,.5);backdrop-filter:blur(2px);z-index:50;display:flex;justify-content:flex-end;opacity:0;transition:opacity .18s}
  .scrim.show{opacity:1}.scrim.center{align-items:center;justify-content:center;padding:16px}
  .panel{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow-lg);transform:translateX(20px);transition:transform .2s;display:flex;flex-direction:column}
  .scrim.show .panel{transform:none}
  .modal{background:var(--surface);border-radius:var(--r);width:min(680px,100%);max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:scale(.98);transition:transform .18s}

  .panel-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:flex-start;gap:12px;z-index:2}

  .panel-body{padding:18px 20px;flex:1}.panel-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 20px;display:flex;gap:10px;justify-content:flex-end}
  .x{margin-left:auto;background:none;border:0;color:var(--muted);border-radius:8px;padding:5px;display:grid;place-items:center}.x:hover{background:var(--surface-2);color:var(--ink)}.x svg{width:20px;height:20px}
  .linerow{display:grid;grid-template-columns:1fr 84px 34px;gap:9px;align-items:center;margin-bottom:9px}
  .linerow .rm{background:none;border:1px solid var(--border);border-radius:8px;color:var(--crit);padding:8px;display:grid;place-items:center}
  .recv-row{display:grid;grid-template-columns:1fr 74px 74px 74px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
  .recv-row .cap{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
  .steps{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
  .step{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);font-weight:600}
  .step .n{width:18px;height:18px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-size:10px}
  .step.done .n{background:var(--good);border-color:var(--good);color:#fff}.step.cur .n{background:var(--accent);border-color:var(--accent);color:#fff}.step.cur{color:var(--ink)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:600}
  .banner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;font-size:12.5px;margin-bottom:14px}
  .banner svg{width:17px;height:17px;flex:none;margin-top:1px}
  .banner.info{background:var(--accent-soft);color:var(--accent-ink)}.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.crit{background:var(--crit-soft);color:var(--crit)}.banner.transit{background:var(--transit-soft);color:var(--transit)}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .search{position:relative;flex:1;min-width:180px;max-width:340px}
  .search input{width:100%;padding:9px 11px 9px 34px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--ink)}
  .search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--faint)}
  select.filter{padding:9px 11px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:500}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);z-index:80;opacity:0;transition:.22s;pointer-events:none;display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;transform:translateX(-50%)}.toast svg{width:17px;height:17px}
  .lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);background:var(--surface-2);border:1px dashed var(--border-strong);padding:7px 11px;border-radius:9px}.lock svg{width:14px;height:14px}
  .mobile-tabs{display:none}
  /* login */
  .login{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:var(--bg)}
  .login .box{width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:30px}
  .login h2{font-size:22px;margin-bottom:6px}.login p{color:var(--muted);font-size:13.5px;margin:0 0 18px}

    .mobile-tabs{display:flex;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
    .mtab{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10.5px;font-weight:600;border-radius:8px;position:relative}
    .mtab svg{width:20px;height:20px}.mtab.active{color:var(--accent)}
    .mtab .badge-count{position:absolute;top:2px;right:22%;background:var(--crit);color:#fff;border-radius:20px;font-size:9px;font-weight:700;padding:0 5px}
  }
  @media (max-width:440px){.tiles{grid-template-columns:1fr 1fr;gap:10px}.tile .val{font-size:22px}.topbar h1{font-size:16px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

      <button class="hamburger" id="hamburger" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

<script>
"use strict";
/* ============================================================
   Stock Transfer Hub — production app (Supabase-connected)
   Reads live data; every stock/cost action calls a server-side
   database function (RPC) so the maths is safe and enforced.
   ============================================================ */
let sb = null;
function initClient(){
  if(!window.SUPABASE_URL || window.SUPABASE_URL.includes("YOUR-PROJECT") || !window.SUPABASE_ANON_KEY || window.SUPABASE_ANON_KEY.includes("YOUR-")){
    return false;
  }
  sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  return true;
}

/* icons */

 d="M4 9h16M9 3v4M15 3v4"/>',supplier:'<path d="M3 7h12v9H3zM15 10h3.5l2.5 3v3H15z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/>'};

/* state */

const availAt=(l,it)=>onHand(l,it)-reservedAt(l,it);

const trShortU=t=>(t.lines||[]).reduce((s,l)=>s+Math.max(0,l.qty_dispatched-l.qty_received),0);
const trShortV=t=>(t.lines||[]).reduce((s,l)=>s+Math.max(0,l.qty_dispatched-l.qty_received)*item(l.item_id).unit_cost,0);

/* ---------- data loading ---------- */
async function loadAll(){
  const q=async(p)=>{const{data,error}=await p;if(error)throw error;return data||[];};
  try{
    const[locations,items,stockRows,transfers,receipts,suppliers,orders,stocktakes,profiles,audit]=await Promise.all([
      q(sb.from('locations').select('*').order('code')),
      q(sb.from('items').select('*').order('name')),
      q(sb.from('stock').select('*')),
      q(sb.from('transfers').select('*, lines:transfer_lines(*)').order('created_at',{ascending:false})),
      q(sb.from('receipts').select('*, lines:receipt_lines(*)').order('received_on',{ascending:false})),
      q(sb.from('suppliers').select('*').order('name')),
      q(sb.from('purchase_orders').select('*, lines:purchase_order_lines(*)').order('created_at',{ascending:false})),
      q(sb.from('stocktakes').select('*, lines:stocktake_lines(*)').order('started_at',{ascending:false})),
      q(sb.from('profiles').select('*')),
      q(sb.from('audit_log').select('*').order('ts',{ascending:false}).limit(80)),
    ]);
    S.locations=locations.map(l=>({...l})); S.items=items; S.transfers=transfers; S.receipts=receipts;
    S.suppliers=suppliers; S.orders=orders; S.stocktakes=stocktakes; S.profiles=profiles; S.audit=audit;
    S.stock={}; stockRows.forEach(r=>{S.stock[r.location_id+'__'+r.item_id]=r.on_hand;});
    return true;
  }catch(e){ toast('Could not load data: '+(e.message||e),true); console.error(e); return false; }
}
async function refresh(){ await loadAll(); renderNav(); renderSq(); renderView(); }

  if(!initClient()){ showLogin('Configuration needed: open index.html and set your Supabase URL and anon key at the top, then redeploy.'); return; }
  const{data:{session}}=await sb.auth.getSession();
  if(session) return startApp();

async function startApp(){
  // load my profile → role + home centre
  const{data:{user}}=await sb.auth.getUser();
  ME=user;
  let{data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!prof){ prof={id:user.id,email:user.email,full_name:user.email,role:'user',home_centre:null}; }

  document.getElementById('login').hidden=true;

  document.getElementById('avatar').textContent=(prof.full_name||prof.email||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();

function openTransfer(id){
  const t=S.transfers.find(x=>x.id===id);if(!t)return;
  const steps=['requested','approved','in_transit','received'];
  const cur=t.status==='cancelled'?-1:(t.status==='partially_received'?2:steps.indexOf(t.status));
  const stepHtml=t.status==='cancelled'?`<div class="banner crit">${svg(I.x,17)}<div>Cancelled.</div></div>`:`<div class="steps">${steps.map((s,i)=>`<div class="step ${i<cur?'done':''} ${i===cur?'cur':''}"><span class="n">${i<cur?'✓':i+1}</span>${STATUS[s].label}</div>${i<3?`<span>${svg(I.arrow,13)}</span>`:''}`).join('')}</div>`;
  const du=trShortU(t),dv=trShortV(t);
  const rows=(t.lines||[]).map(l=>{const it=item(l.item_id);const sh=Math.max(0,l.qty_dispatched-l.qty_received);const shown=['received','partially_received'].includes(t.status);return `<tr><td><div style="font-weight:600">${esc(it.name)}</div><div class="mono" style="font-size:11px;color:var(--faint)">${it.sku}</div></td><td class="num tnum">${l.qty_requested}</td><td class="num tnum">${l.qty_dispatched||'—'}</td><td class="num tnum">${shown?l.qty_received:(t.status==='in_transit'?'—':'')}</td><td class="num tnum" style="color:${sh>0&&shown?'var(--crit)':'var(--faint)'}">${sh>0&&shown?'−'+sh:'—'}</td></tr>`;}).join('');

function sum(){

  slideover(st.code,loc(st.location_id).name,`${open?`<div class="banner transit">${svg(I.sync,17)}<div><b>Live.</b> System quantities reflect current stock, including sales during the count.</div></div>`:''}<div class="card pad" style="margin-bottom:14px"><dl class="kv"><dt>Centre</dt><dd>${esc(loc(st.location_id).name)}</dd><dt>Status</dt><dd>${open?'<span class="pill p-transit">In progress</span>':'<span class="pill p-done">Completed</span>'}</dd><dt>Started</dt><dd>${fmtDT(st.started_at)}</dd></dl></div>${rows}`,foot);
  if(open){
    document.querySelectorAll('[data-c]').forEach(inp=>inp.oninput=e=>{const sys=+e.target.dataset.sys;const val=e.target.value===''?null:Math.max(0,+e.target.value);const vv=val==null?null:val-sys;const ve=document.querySelector(`[data-v="${e.target.dataset.c}"]`);ve.textContent=vv==null?'—':(vv>0?'+'+vv:vv);ve.style.color=vv==null?'var(--faint)':(vv===0?'var(--good)':(vv>0?'var(--transit)':'var(--crit)'));});
    const fin=document.getElementById('fin');if(fin)fin.onclick=async()=>{
      const counts=[];document.querySelectorAll('[data-c]').forEach(inp=>{if(inp.value!=='')counts.push({line:inp.dataset.c,counted:Math.max(0,+inp.value)});});
      if(!counts.length)return toast('Enter at least one count',true);
      await callRpc('finalize_stocktake',{p_id:id,p_counts:counts},'Stock take finalised');
    };
  }
}
/* Receipts */
let rcSearch='';
function vReceipts(v){
  v.innerHTML=`<div class="toolbar"><div class="search">${svg(I.search,16)}<input id="q" placeholder="Search GRN, supplier…" value="${esc(rcSearch)}"></div><div class="spacer"></div>${can('receipt.create')?`<button class="btn primary" data-act="new-receipt">${svg(I.plus,16)} New receipt</button>`:''}</div>
    <div class="banner info">${svg(I.info,17)}<div>Recording a receipt adds stock to a centre and updates the item’s weighted-average cost.</div></div><div id="list"></div>`;
  document.getElementById('q').oninput=e=>{rcSearch=e.target.value;rcList();};rcList();
}
function rcList(){
  const q=rcSearch.toLowerCase();let list=S.receipts.filter(r=>!scoped()||r.location_id===HOME);
  if(q)list=list.filter(r=>r.code.toLowerCase().includes(q)||(r.supplier||'').toLowerCase().includes(q));
  document.getElementById('list').innerHTML=list.length?`<div class="tablewrap"><table><thead><tr><th>Receipt</th><th>Supplier</th><th>Into</th><th class="num">Total</th><th>Date</th></tr></thead><tbody>${list.map(r=>`<tr class="clickable" data-rcpt="${r.id}"><td><span class="mono">${r.code}</span></td><td>${esc(r.supplier||'—')}</td><td>${loc(r.location_id).code}</td><td class="num tnum">${money((r.lines||[]).reduce((s,l)=>s+l.qty*l.unit_cost,0))}</td><td style="color:var(--faint);font-size:12.5px">${fmtDate(r.received_on)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="card empty">${svg(I.receipt,38)}<div>No receipts yet.</div></div>`;
}
function openReceipt(id){
  const r=S.receipts.find(x=>x.id===id);if(!r)return;
  const rows=(r.lines||[]).map(l=>{const it=item(l.item_id);return `<tr><td><div style="font-weight:600">${esc(it.name)}</div><div class="mono" style="font-size:11px;color:var(--faint)">${it.sku}</div></td><td class="num tnum">${l.qty}</td><td class="num tnum">${money(l.unit_cost)}</td><td class="num tnum">${money(l.qty*l.unit_cost)}</td></tr>`;}).join('');
  slideover(r.code,r.supplier||'',`<div class="card pad" style="margin-bottom:16px"><dl class="kv"><dt>Supplier</dt><dd>${esc(r.supplier||'—')}</dd><dt>Reference</dt><dd class="mono">${esc(r.reference||'—')}</dd><dt>Into</dt><dd>${esc(loc(r.location_id).name)}</dd><dt>Date</dt><dd>${fmtDate(r.received_on)}</dd><dt>By</dt><dd>${esc(pname(r.created_by))}</dd></dl></div><div class="tablewrap"><table style="min-width:0"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Cost</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table></div>`,'');
}
let recLines=[];
function newReceipt(){
  recLines=[{item:'',qty:1,cost:0}];
  const lo=S.locations.filter(l=>l.active!==false).map(l=>`<option value="${l.id}">${esc(l.name)} (${l.code})</option>`).join('');
  modal('New goods receipt','Record a supplier delivery',`<div class="grid2"><div class="field"><label>Into</label><select id="rc-loc">${lo}</select></div><div class="field"><label>Date</label><input type="date" id="rc-date" value="${today()}"></div></div><div class="grid2"><div class="field"><label>Supplier</label><input id="rc-sup" placeholder="Supplier name"></div><div class="field"><label>Invoice / ref</label><input id="rc-ref"></div></div><div class="field"><label>Items received</label><div id="red"></div><button class="btn sm" id="rAdd" style="margin-top:4px">${svg(I.plus,14)} Add item</button></div><div class="field"><label>Notes</label><textarea id="rc-notes" rows="2"></textarea></div><div class="banner info" id="rsum">${svg(I.cost,17)}<div>Add items.</div></div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="go">${svg(I.check,16)} Post receipt</button>`);
  if(scoped()){const ls=document.getElementById('rc-loc');ls.value=HOME;ls.disabled=true;}
  rEd();document.getElementById('rAdd').onclick=()=>{recLines.push({item:'',qty:1,cost:0});rEd();};
  document.getElementById('go').onclick=submitReceipt;
}
function rEd(){
  const io=S.items.filter(i=>i.active!==false).map(i=>`<option value="${i.id}">${esc(i.name)} — ${i.sku}</option>`).join('');
  const ed=document.getElementById('red');
  ed.innerHTML=recLines.map((l,ix)=>`<div class="linerow" style="grid-template-columns:1fr 62px 80px 34px"><select data-ri="${ix}"><option value="">Select item…</option>${io}</select><input type="number" min="1" value="${l.qty}" data-rq="${ix}"><input type="number" min="0" step="0.01" value="${l.cost||''}" placeholder="$ cost" data-rk="${ix}"><button class="rm" data-rr="${ix}">${svg(I.x,15)}</button></div>`).join('');
  recLines.forEach((l,ix)=>{if(l.item)ed.querySelector(`[data-ri="${ix}"]`).value=l.item;});
  ed.querySelectorAll('[data-ri]').forEach(s=>s.onchange=e=>{const ix=+e.target.dataset.ri;recLines[ix].item=e.target.value;if(!recLines[ix].cost){recLines[ix].cost=item(e.target.value).unit_cost;ed.querySelector(`[data-rk="${ix}"]`).value=recLines[ix].cost;}rSum();});
  ed.querySelectorAll('[data-rq]').forEach(s=>s.oninput=e=>{recLines[+e.target.dataset.rq].qty=Math.max(1,+e.target.value||1);rSum();});
  ed.querySelectorAll('[data-rk]').forEach(s=>s.oninput=e=>{recLines[+e.target.dataset.rk].cost=Math.max(0,+e.target.value||0);rSum();});
  ed.querySelectorAll('[data-rr]').forEach(s=>s.onclick=e=>{const ix=+e.target.closest('[data-rr]').dataset.rr;if(recLines.length>1)recLines.splice(ix,1);rEd();});
  rSum();
}
function rSum(){const t=recLines.reduce((a,l)=>a+(l.item?l.qty*l.cost:0),0);document.getElementById('rsum').innerHTML=`${svg(I.cost,17)}<div>Total cost <b>${money(t)}</b>.</div>`;}
async function submitReceipt(){
  const lc=document.getElementById('rc-loc').value,sup=document.getElementById('rc-sup').value.trim(),ref=document.getElementById('rc-ref').value.trim(),date=document.getElementById('rc-date').value,notes=document.getElementById('rc-notes').value.trim();
  const lines=recLines.filter(l=>l.item&&l.qty>0);if(!sup)return toast('Enter a supplier',true);if(!lines.length)return toast('Add an item',true);
  await callRpc('post_receipt',{p_loc:lc,p_supplier:sup,p_ref:ref,p_date:date,p_notes:notes,p_lines:lines.map(l=>({item:l.item,qty:l.qty,cost:l.cost}))},'Receipt posted');
}
/* Catalog */
let catSearch='',catCat='all';
function vCatalog(v){
  const cats=['all',...new Set(S.items.map(i=>i.category).filter(Boolean))];
  v.innerHTML=`<div class="banner info">${svg(I.sync,17)}<div><b>Synced from Square.</b> ${S.items.length} items. New items in Square flow in automatically.</div></div>
    <div class="toolbar"><div class="search">${svg(I.search,16)}<input id="q" placeholder="Search name or SKU…" value="${esc(catSearch)}"></div><select class="filter" id="c">${cats.map(c=>`<option value="${c}">${c==='all'?'All categories':esc(c)}</option>`).join('')}</select><div class="spacer"></div>${can('sync.run')?`<button class="btn" data-act="sync">${svg(I.sync,16)} Sync now</button>`:''}</div><div id="list"></div>`;
  document.getElementById('c').value=catCat;document.getElementById('q').oninput=e=>{catSearch=e.target.value;catList();};document.getElementById('c').onchange=e=>{catCat=e.target.value;catList();};catList();
}
function catList(){
  const q=catSearch.toLowerCase();let list=S.items.slice();
  if(catCat!=='all')list=list.filter(i=>i.category===catCat);
  if(q)list=list.filter(i=>i.name.toLowerCase().includes(q)||(i.sku||'').toLowerCase().includes(q));
  const oh=scoped()?('On hand ('+loc(HOME).code+')'):'Total on hand';
  document.getElementById('list').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Item</th><th>Category</th><th class="num">Cost</th><th class="num">Price</th><th class="num">${oh}</th></tr></thead><tbody>${list.map(i=>{let t=0;if(scoped())t=onHand(HOME,i.id);else for(const k in S.stock)if(k.endsWith('__'+i.id))t+=S.stock[k];return `<tr class="clickable" data-itm="${i.id}"><td><div style="font-weight:600">${esc(i.name)}</div><div class="mono" style="font-size:11px;color:var(--faint)">${esc(i.sku||'')}</div></td><td><span class="tag">${esc(i.category||'—')}</span></td><td class="num tnum">${money(i.unit_cost)}</td><td class="num tnum">${money(i.price)}</td><td class="num tnum">${t}</td></tr>`;}).join('')}</tbody></table></div>`;
}
function openItem(id){
  const it=S.items.find(x=>x.id===id);if(!it)return;
  const rows=S.locations.filter(l=>visLocs().includes(l.id)).map(l=>`<tr><td>${esc(l.name)} <span class="tag">${l.code}</span></td><td class="num tnum">${onHand(l.id,id)}</td><td class="num tnum">${money(onHand(l.id,id)*it.unit_cost)}</td></tr>`).join('');
  slideover(it.name,it.sku||'',`<div class="card pad" style="margin-bottom:16px"><dl class="kv"><dt>SKU</dt><dd class="mono">${esc(it.sku||'—')}</dd><dt>Cost</dt><dd class="tnum">${money(it.unit_cost)}</dd><dt>Price</dt><dd class="tnum">${money(it.price)}</dd><dt>Margin</dt><dd class="tnum">${it.price>0?Math.round((1-it.unit_cost/it.price)*100):0}%</dd></dl></div><div class="tablewrap"><table style="min-width:0"><thead><tr><th>Location</th><th class="num">On hand</th><th class="num">Value</th></tr></thead><tbody>${rows}</tbody></table></div>`,'');
}
/* Suppliers */
function vSuppliers(v){
  v.innerHTML=`<div class="toolbar"><div class="spacer"></div>${can('supplier.manage')?`<button class="btn primary" data-act="new-supplier">${svg(I.plus,16)} Add supplier</button>`:''}</div><div class="tablewrap"><table><thead><tr><th>Supplier</th><th>Country</th><th>Contact</th><th class="num">Lead time</th><th class="num">Open orders</th></tr></thead><tbody>${S.suppliers.map(s=>{const open=S.orders.filter(o=>o.supplier_id===s.id&&(o.status==='placed'||o.status==='shipped')).length;return `<tr><td style="font-weight:600">${esc(s.name)}</td><td style="color:var(--muted)">${esc(s.country||'—')}</td><td class="mono" style="font-size:12px;color:var(--muted)">${esc(s.contact||'—')}</td><td class="num tnum">${s.lead_days||'—'} days</td><td class="num tnum">${open}</td></tr>`;}).join('')}</tbody></table></div>`;
}
function newSupplier(){
  modal('Add supplier','Someone you order stock from',`<div class="field"><label>Name</label><input id="su-name" placeholder="e.g. Premvati India"></div><div class="grid2"><div class="field"><label>Country</label><input id="su-country"></div><div class="field"><label>Lead time (days)</label><input id="su-lead" type="number" value="30"></div></div><div class="field"><label>Contact email</label><input id="su-contact"></div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="go">Add supplier</button>`);
  document.getElementById('go').onclick=async()=>{
    const name=document.getElementById('su-name').value.trim();if(!name)return toast('Enter a name',true);
    const{error}=await sb.from('suppliers').insert({name,country:document.getElementById('su-country').value.trim(),contact:document.getElementById('su-contact').value.trim(),lead_days:+document.getElementById('su-lead').value||30});
    if(error)return toast(error.message,true);closeOverlay();toast('Supplier added');refresh();
  };
}
/* Locations, Users, Audit, Settings */
function vLocations(v){
  v.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Location</th><th>Code</th><th>City</th><th class="num">Stock value</th><th>Type</th></tr></thead><tbody>${S.locations.map(l=>{let val=0;S.items.forEach(i=>val+=onHand(l.id,i.id)*i.unit_cost);return `<tr><td style="font-weight:600">${esc(l.name)}</td><td><span class="tag">${l.code}</span></td><td style="color:var(--muted)">${esc(l.city||'—')}</td><td class="num tnum">${money(val)}</td><td>${l.is_hub?'<span class="pill p-appr">Hub</span>':'<span class="tag">Store</span>'}</td></tr>`;}).join('')}</tbody></table></div>`;
}
function vUsers(v){
  const badge=r=>({user:'p-draft',admin:'p-appr',national_admin:'p-partial',super_admin:'p-transit'}[r]||'p-draft');
  v.innerHTML=`<div class="banner info">${svg(I.info,17)}<div>Assign each person a role and (for User/Admin) a home centre. Change a value below and it saves.</div></div>
    <div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Home centre</th></tr></thead><tbody>${S.profiles.map(u=>`<tr><td style="font-weight:600">${esc(u.full_name||'—')}</td><td class="mono" style="font-size:12px;color:var(--muted)">${esc(u.email||'')}</td>
      <td>${can('*')?`<select data-urole="${u.id}" style="padding:5px 8px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--ink)">${Object.keys(ROLES).map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${ROLES[r].name}</option>`).join('')}</select>`:`<span class="pill ${badge(u.role)}">${(ROLES[u.role]||{name:u.role}).name}</span>`}</td>
      <td>${can('*')?`<select data-uhome="${u.id}" style="padding:5px 8px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--ink)"><option value="">— none —</option>${S.locations.map(l=>`<option value="${l.id}" ${u.home_centre===l.id?'selected':''}>${l.code}</option>`).join('')}</select>`:((u.role==='national_admin'||u.role==='super_admin')?'<span class="tag">All</span>':loc(u.home_centre).code)}</td></tr>`).join('')}</tbody></table></div>`;
  if(can('*')){
    document.querySelectorAll('[data-urole]').forEach(s=>s.onchange=async e=>{const{error}=await sb.from('profiles').update({role:e.target.value}).eq('id',e.target.dataset.urole);toast(error?error.message:'Role updated',!!error);if(!error)refresh();});
    document.querySelectorAll('[data-uhome]').forEach(s=>s.onchange=async e=>{const{error}=await sb.from('profiles').update({home_centre:e.target.value||null}).eq('id',e.target.dataset.uhome);toast(error?error.message:'Home centre updated',!!error);if(!error)refresh();});
  }
}
function vAudit(v){
  let list=S.audit;if(scoped())list=list.filter(a=>a.location_id===HOME);
  v.innerHTML=`<div class="tablewrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th></tr></thead><tbody>${list.map(a=>`<tr><td style="white-space:nowrap;color:var(--muted);font-size:12.5px">${fmtDT(a.ts)}</td><td style="font-weight:600;white-space:nowrap">${esc(pname(a.actor))}</td><td>${esc(a.action)}</td></tr>`).join('')}</tbody></table></div>`;
}
function vSettings(v){
  v.innerHTML=`<div class="card pad" style="margin-bottom:16px"><div class="sq-title" style="font-size:15px">${svg(I.sync,18)} Square connection</div>
    <dl class="kv" style="margin-top:12px"><dt>Locations</dt><dd>${S.locations.length}</dd><dt>Catalog items</dt><dd>${S.items.length}</dd></dl>
    <div style="font-size:13px;color:var(--muted);margin-top:12px">New &amp; changed items and live stock arrive automatically via Square webhooks. Use “Sync now” to pull a full refresh.</div></div>
    ${can('sync.run')?`<button class="btn primary" data-act="sync">${svg(I.sync,16)} Run full sync now</button>`:`<span class="lock">${svg(I.lock,14)} Sync is National/Super Admin only</span>`}`;
}
function renderSq(){document.getElementById('sqStatus').innerHTML=`<div class="sq-title">${svg(I.sync,13)} Square</div><div class="sq-row"><span class="dot ok"></span> ${S.items.length} items · ${S.locations.length} sites</div>`;}
async function runSync(){
  toast('Syncing with Square…');
  try{const{data,error}=await sb.functions.invoke('square-sync');if(error)throw error;toast('Synced'+(data&&data.itemsUpserted!=null?` — ${data.itemsUpserted} items`:''));refresh();}
  catch(e){toast('Sync failed: '+(e.message||e),true);}
}

/* ---------- RPC wrapper ---------- */
async function callRpc(fn,args,okMsg){
  const{error}=await sb.rpc(fn,args);
  if(error){toast(error.message||'Action failed',true);return;}
  closeOverlay();toast(okMsg||'Done');await refresh();
}

/* ---------- overlays / toast / nav plumbing ---------- */
function overlayEl(){return document.getElementById('overlay');}
function slideover(t,s,b,f){overlayEl().innerHTML=`<div class="scrim" id="scrim"><div class="panel" role="dialog"><div class="panel-head"><div><h2>${esc(t)}</h2><div class="sub">${esc(s)}</div></div><button class="x" data-close>${svg(I.x,20)}</button></div><div class="panel-body">${b}</div>${f?`<div class="panel-foot">${f}</div>`:''}</div></div>`;showScrim();}
function modal(t,s,b,f){overlayEl().innerHTML=`<div class="scrim center" id="scrim"><div class="modal" role="dialog"><div class="panel-head"><div><h2>${esc(t)}</h2><div class="sub">${esc(s)}</div></div><button class="x" data-close>${svg(I.x,20)}</button></div><div class="panel-body">${b}</div>${f?`<div class="panel-foot">${f}</div>`:''}</div></div>`;showScrim();}
function showScrim(){const s=document.getElementById('scrim');requestAnimationFrame(()=>s.classList.add('show'));s.addEventListener('click',e=>{if(e.target===s)closeOverlay();});}
function closeOverlay(){const s=document.getElementById('scrim');if(!s)return;s.classList.remove('show');setTimeout(()=>overlayEl().innerHTML='',180);}
let toastT;
function toast(m,bad){const t=document.getElementById('toast');t.innerHTML=`${svg(bad?I.alert:I.check,17)}<span>${esc(m)}</span>`;t.style.background=bad?'var(--crit)':'var(--ink)';t.style.color=bad?'#fff':'var(--bg)';t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);}
function toggleSidebar(f){document.getElementById('sidebar').classList.toggle('open',f);document.getElementById('sidebarScrim').classList.toggle('show',f);}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-route]');if(nav){go(nav.dataset.route);return;}
  const tr=e.target.closest('[data-tr]');if(tr){openTransfer(tr.dataset.tr);return;}
  const od=e.target.closest('[data-order]');if(od){openOrder(od.dataset.order);return;}
  const stk=e.target.closest('[data-stk]');if(stk){openStock(stk.dataset.stk);return;}
  const rp=e.target.closest('[data-rcpt]');if(rp){openReceipt(rp.dataset.rcpt);return;}
  const it=e.target.closest('[data-itm]');if(it){openItem(it.dataset.itm);return;}
  if(e.target.closest('[data-close]')){closeOverlay();return;}
  const a=e.target.closest('[data-act]');if(a){const k=a.dataset.act;({'new-transfer':newTransfer,'new-order':newOrder,'new-stock':newStock,'new-receipt':newReceipt,'new-supplier':newSupplier,'sync':runSync}[k]||(()=>{}))();return;}
  const ap=e.target.closest('[data-approve]');if(ap){callRpc('approve_transfer',{p_id:ap.dataset.approve},'Approved');return;}
  const cx=e.target.closest('[data-cancel]');if(cx){callRpc('cancel_transfer',{p_id:cx.dataset.cancel},'Cancelled');return;}
  const dp=e.target.closest('[data-dispatch]');if(dp){callRpc('dispatch_transfer',{p_id:dp.dataset.dispatch},'Dispatched to transit');return;}
  const rc=e.target.closest('[data-receive]');if(rc){openReceive(rc.dataset.receive);return;}
  const os=e.target.closest('[data-oship]');if(os){callRpc('ship_order',{p_id:os.dataset.oship},'Marked shipped');return;}
  const orr=e.target.closest('[data-orecv]');if(orr){callRpc('receive_order',{p_id:orr.dataset.orecv},'Order received');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay();});
document.getElementById('hamburger').onclick=()=>toggleSidebar(true);
document.getElementById('sidebarScrim').onclick=()=>toggleSidebar(false);
document.getElementById('themeBtn').onclick=()=>{const r=document.documentElement,c=r.getAttribute('data-theme');r.setAttribute('data-theme',c==='dark'?'light':(c==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark')));};
document.getElementById('signout').onclick=async()=>{await sb.auth.signOut();location.reload();};
document.getElementById('sendLink').onclick=async()=>{
  const email=document.getElementById('email').value.trim();if(!email)return;
  const btn=document.getElementById('sendLink');btn.disabled=true;btn.textContent='Sending…';
  const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  const m=document.getElementById('loginMsg');
  if(error){m.textContent=error.message;m.style.color='var(--crit)';btn.disabled=false;btn.textContent='Email me a sign-in link';}
  else{m.textContent='Check your email for the sign-in link. You can close this tab.';m.style.color='var(--good)';btn.textContent='Link sent ✓';}
};
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('sendLink').click();});

boot();
</script>
</body>
</html>
