<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandir Event Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="agreement.js"></script>
<style>
/* Layout: fixed navy sidebar (brand, nav, user) + scrolling workspace; dashboard = KPIs, bookings list + calendar; event = header, progress, tabs */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#f9fafc; --ink:#121a2b; --muted:#5f6b7f; --line:#e3e6ed;
  --navy:#0f1b2d; --navy-2:#18263c; --navy-ink:#cfd6e2;
  --accent:#c9741f; --accent-ink:#ffffff; --accent-soft:#fbeedd;
  --ok:#21794a; --ok-soft:#e1f2e8; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b42318; --bad-soft:#fde8e6; --info:#2753a3; --info-soft:#e5edfb;
  --f-display:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif; --f-body:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif; --f-doc:Arial, Helvetica, sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c111b; --surface:#151c29; --surface-2:#111826; --ink:#e9ecf2; --muted:#9aa4b6; --line:#263044; --navy:#0a1220; --navy-2:#131e31;
  --accent:#e59443; --accent-ink:#1a1206; --accent-soft:#33261a;
  --ok:#6ccf98; --ok-soft:#173226; --warn:#e8b45a; --warn-soft:#33291a; --bad:#f2877d; --bad-soft:#3b1f1d; --info:#8fb3f5; --info-soft:#1b2740; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c111b; --surface:#151c29; --surface-2:#111826; --ink:#e9ecf2; --muted:#9aa4b6; --line:#263044; --navy:#0a1220; --navy-2:#131e31;
  --accent:#e59443; --accent-ink:#1a1206; --accent-soft:#33261a;
  --ok:#6ccf98; --ok-soft:#173226; --warn:#e8b45a; --warn-soft:#33291a; --bad:#f2877d; --bad-soft:#3b1f1d; --info:#8fb3f5; --info-soft:#1b2740; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:28px} h2{font-size:19px} h3{font-size:16px}
.panel-h h2,.panel-h h3{font-family:var(--f-body);font-weight:700;letter-spacing:0;font-size:15px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
body:not(.authed) .shell{grid-template-columns:1fr}
body:not(.authed) .side{display:none}
.side{background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 22px}
.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--accent),#e7a95c);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:600;font-size:19px;flex:none}
.brand h1{font-size:16px;color:#fff;line-height:1.2}.brand small{display:block;font-size:11.5px;opacity:.65;font-family:var(--f-body)}
#mainNav{display:flex;flex-direction:column;gap:3px;flex:1}
#mainNav .navlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.5;padding:14px 10px 6px}
#mainNav .btn.ghost{color:var(--navy-ink);justify-content:flex-start;padding:9px 12px;border-radius:10px;font-weight:500;width:100%}
#mainNav .btn.ghost:hover{background:var(--navy-2);border-color:transparent;color:#fff}
#mainNav .btn.ghost.on{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
#mainNav .btn.primary{margin:6px 0 4px;justify-content:center;padding:10px 12px}
#mainNav .ico{width:18px;text-align:center;opacity:.8}
.who{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding:14px 8px 0;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--navy-ink)}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--navy-2);display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px;flex:none}
.who .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .btn.ghost{color:var(--navy-ink);padding:4px 8px;width:auto!important;flex:none}
.who .btn.ghost:hover{color:#fff;background:var(--navy-2)}
main{max-width:1180px;width:100%;margin:0 auto;padding:28px 28px 64px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;z-index:20;overflow-x:auto}
  .brand{padding:0}.brand div{display:none}
  #mainNav{flex-direction:row;align-items:center;flex:1}
  #mainNav .navlbl{display:none}
  #mainNav .btn{width:auto!important;white-space:nowrap}
  .who{margin:0;border:0;padding:0}.who .nm,.who .av{display:none}
  main{padding:18px 14px 48px}
}
/* page head */
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.pagehead .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:#c5cad5}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 1px 2px rgba(201,116,31,.25)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost.on{background:var(--accent-soft);color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.ev-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{padding:11px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);margin-bottom:16px;font-size:14px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:0 0 22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;transition:border-color .15s, transform .15s}
.kpi:hover{border-color:var(--accent)}
.kpi b{display:block;font-size:30px;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.kpi.alert b{color:var(--bad)}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media (max-width:1050px){.dash{grid-template-columns:1fr}}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px 18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:13.5px}
/* event list */
.ev-row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;transition:background .12s}
.ev-row:hover{background:var(--surface-2)}
.ev-row:last-child{border-bottom:0}
.dateblk{text-align:center;border-radius:12px;padding:6px 0;line-height:1.1;background:var(--surface-2);border:1px solid var(--line)}
.dateblk .m{font-size:10.5px;text-transform:uppercase;color:var(--accent);font-weight:700;letter-spacing:.08em}
.dateblk .d{font-family:var(--f-display);font-size:23px;font-weight:600}
.dateblk .w{font-size:10.5px;color:var(--muted)}
.ev-main .t{font-weight:700}
.ev-main .s{color:var(--muted);font-size:13px}
.ev-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.p-enq{background:var(--info-soft);color:var(--info)}
.p-sign{background:var(--warn-soft);color:var(--warn)}
.p-dep{background:var(--accent-soft);color:var(--accent)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-done{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-done::before{display:none}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.next{font-size:12.5px;color:var(--muted)}
.next.over{color:var(--bad);font-weight:600}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
/* calendar */
.cal{padding:16px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h3{font-family:var(--f-body);font-weight:700;font-size:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:12.5px;text-align:center}
.cal-grid .dow{color:var(--muted);padding:4px 0;font-weight:600;font-size:11px}
.cal-grid .c{padding:7px 0;border-radius:9px;position:relative;font-variant-numeric:tabular-nums}
.cal-grid .c.other{color:var(--line)}
.cal-grid .c.today{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:700}
.cal-grid .c.has{background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.cal-grid .c.clash{background:var(--bad);color:#fff}
.cal-list{margin-top:12px;font-size:13px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.cal-list a{text-decoration:none;color:var(--ink)}
.cal-list a b{color:var(--accent);display:inline-block;min-width:22px}
/* event page */
.ev-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:4px}
.ev-head h1{font-size:27px}
.ev-head .meta{color:var(--muted);font-size:14px;margin-top:4px}
.ev-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper{display:flex;gap:4px;margin:18px 0 6px}
.stepper i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stepper i.done{background:var(--ok)}
.stepper i.cur{background:var(--accent)}
.stepper i.over{background:var(--bad)}
.stepcap{font-size:13px;color:var(--muted);margin-bottom:6px}
.tabs{display:flex;gap:4px;margin:16px 0 20px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow);width:max-content;max-width:100%}
.tab{border:0;background:none;padding:8px 14px;cursor:pointer;border-radius:9px;color:var(--muted);white-space:nowrap;font-weight:600;font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--navy);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea,.tbl input,.tbl select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus,.tbl input:focus{background:var(--surface);border-color:var(--accent)}
.fld textarea{min-height:96px;resize:vertical}
.fld.wide{grid-column:1/-1}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl input.n{width:88px;text-align:right}
.ms{display:grid;grid-template-columns:26px minmax(0,1fr) 130px 140px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:0}
.ms .lbl small{display:block;color:var(--muted);font-size:12px}
.ms .due{font-size:13px;font-variant-numeric:tabular-nums}
.ms .due.over{color:var(--bad);font-weight:700}
.ms input[type=date]{padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13px;width:100%}
@media (max-width:600px){.ms{grid-template-columns:26px 1fr}.ms .due,.ms input[type=date]{grid-column:2}}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.sum{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:14px}
.sum div span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sum div b{font-size:19px;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:13px}
.doc{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc .ico{width:38px;height:46px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft)}
.doc .nm{flex:1;min-width:0}
.doc .nm a{word-break:break-all;font-weight:600}
.doc .nm small{display:block;color:var(--muted)}
.emailbox{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px;max-height:300px;overflow:auto}
.clashwarn{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:10px;font-size:13.5px;margin-bottom:12px}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,32,.55);backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:16px;max-width:660px;width:100%;max-height:90vh;overflow:auto;padding:24px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin-bottom:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.saving{font-size:12px;color:var(--muted)}
.auth{max-width:420px;margin:10vh auto;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.auth .mark{margin-bottom:16px}
.auth h2{margin-bottom:6px;font-size:24px}.auth .form{grid-template-columns:1fr}
.auth .btn.primary{padding:11px}
.auth .links{display:flex;justify-content:space-between;margin-top:14px;font-size:14px}
.auth .links button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
.sp-tabs{display:flex;gap:4px;margin-bottom:6px}.sp-tab{border:1px solid var(--line);background:var(--surface-2);padding:4px 11px;border-radius:8px;cursor:pointer;font-size:13px}.sp-tab.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.sp-draw{position:relative}.sp-canvas{width:100%;height:160px;border:1.5px dashed var(--muted);border-radius:12px;background:#fff;display:block}
.sp-clear{position:absolute;top:6px;right:6px;border:1px solid #ddd;background:#fff;color:#333;border-radius:7px;font-size:12px;padding:2px 9px;cursor:pointer}
.sp-hint{font-size:12px;color:var(--muted);margin-top:4px}.sp-input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.sp-preview{font-family:"Dancing Script",cursive;font-size:40px;min-height:64px;color:#1b2a4a;background:#fff;border-radius:10px;padding:4px 12px;margin-top:6px}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.linkbox input{flex:1;min-width:220px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:13px}
.timeline{display:flex;flex-direction:column;gap:8px;font-size:14px}.timeline div{display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}.dot.on{background:var(--ok)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.res .item{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.res .item b{font-size:14.5px}
.xbox{margin-top:12px;border:2px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px}
.xbadge{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:11px;letter-spacing:.08em;padding:3px 9px;border-radius:6px}
.xrow{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;padding:8px 0;border-top:1px solid rgba(0,0,0,.08)}
.xamt{text-align:right;font-size:13px;white-space:nowrap}
.alerts{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);padding:14px 18px;margin:0 0 20px}
.alerts h2{font-family:var(--f-body);font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.alerts .al{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.alerts .al:first-of-type{border-top:0}
.nbadge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:auto}
.mv{display:inline-flex;gap:0;margin-right:2px}.mv .btn{padding:4px 7px;color:var(--muted)}.mv .btn:hover:not(:disabled){color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand"><div class="mark" aria-hidden="true">S</div><div><h1 id="brandName">Event Manager</h1><small id="brandSub">BAPS Shayona · Venue hire</small></div></div>
  <nav id="mainNav" hidden>
    <button class="btn primary" id="navNew">+ New event</button>
    <span class="navlbl">Manage</span>
    <button class="btn ghost" id="navDash"><span class="ico" aria-hidden="true">▤</span>Events</button>
    <button class="btn ghost" id="navSettings"><span class="ico" aria-hidden="true">⚙</span>Price list &amp; settings</button>
    <button class="btn ghost" id="navTeam" hidden><span class="ico" aria-hidden="true">◎</span>Team</button>
    <span class="who"><span class="av" id="whoAv"></span><span class="nm" id="whoName"></span><button class="btn small ghost" id="navOut">Sign out</button></span>
  </nav>
</aside>
<main id="app"><div class="empty">Loading…</div></main>
</div>
<div id="modalRoot"></div>

<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
document.head.insertAdjacentHTML("beforeend", `<style>${MENU_CSS}</style>`);

/* ---------------- State ---------------- */
const CFG = window.APP_CONFIG||{};
if(CFG.SUPABASE_URL){ let u=String(CFG.SUPABASE_URL).trim().replace(/^(https?:\/\/)+/i,"").replace(/\/+$/,""); CFG.SUPABASE_URL="https://"+u; }
if(CFG.SUPABASE_ANON_KEY) CFG.SUPABASE_ANON_KEY=String(CFG.SUPABASE_ANON_KEY).trim();
let sb=null, session=null, me=null;          // supabase client, auth session, my profile row
let SIGNREQ = {};                            // token -> signing request summary
let TEAM = {profiles:[], invites:[]};
const BUCKET="event-docs";
let EVENTS = {};          // id -> data
let ORG = clone(DEFAULT_ORG), CATALOG = clone(DEFAULT_CATALOG);
let loaded=false, loadErr="", canWrite=true;
let view = {route:"dash", evId:null, tab:"overview", search:"", filter:"active", calMonth:null};
let pendingRender=false;

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

/* write queue: one write at a time per document, latest wins */
const writeQ = {};
function saveDoc(path, data){
  const q = writeQ[path] || (writeQ[path] = {busy:false, next:null});
  q.next = clone(data);
  if(q.busy) return;
  const run = async () => {
    if(!q.next){ q.busy=false; setSaving(); return; }
    q.busy=true; setSaving();
    const d=q.next; q.next=null;
    try {
      const [table,id] = path.split("/");
      const { error } = await sb.from(table).upsert({ id, data:d });
      if(error) throw error;
    }
    catch(e){
      if(e && (e.code==="42501" || /row-level security/i.test(e.message||""))){ canWrite=false; toast("You don't have permission to make this change."); }
      else toast("Could not save: "+(e && e.message || "check your connection and try again"));
    }
    run();
  };
  run();
}
function setSaving(){ const el=$("#saveState"); if(!el) return; const busy=Object.values(writeQ).some(q=>q.busy); el.textContent = busy ? "Saving…" : "All changes saved"; }
function saveEvent(ev){ ev.updatedAt = new Date().toISOString(); EVENTS[ev.id]=ev; saveDoc("events/"+ev.id, clone(ev)); }
function saveSettings(){ if(me?.role!=="admin"){ toast("Only admins can change settings."); return; } saveDoc("app_settings/org", {org:ORG, catalog:CATALOG}); }
const isAdmin = () => me?.role==="admin";

/* ---------------- Routing ---------------- */
function go(hash){ if(location.hash !== hash) location.hash = hash; else route(); }
function route(){
  const h = location.hash.replace(/^#/,"");
  if(h.startsWith("event-")){ const id=h.slice(6); if(view.evId!==id){ view.tab="overview"; } view.route="event"; view.evId=id; }
  else if(h==="settings"){ view.route="settings"; }
  else if(h==="team"){ view.route="team"; if(isAdmin()) loadTeam(); }
  else { view.route="dash"; }
  render();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
$("#navDash").onclick = () => go("#events");
$("#navSettings").onclick = () => go("#settings");
$("#navNew").onclick = () => openNewEvent();
$("#navTeam").onclick = () => go("#team");
$("#navOut").onclick = async () => { await sb.auth.signOut(); location.hash=""; location.reload(); };

/* ---------------- Render ---------------- */
function render(){
  if(!me || !me.active) return;
  const ae = document.activeElement;
  if(ae && $("#app").contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type!=="checkbox"){ pendingRender=true; return; }
  pendingRender=false;
  $("#navDash").classList.toggle("on", view.route==="dash"||view.route==="event");
  $("#navSettings").classList.toggle("on", view.route==="settings");
  $("#navTeam").classList.toggle("on", view.route==="team");
  const app=$("#app");
  let banner = "";
  if(loadErr) banner = `<div class="banner">${esc(loadErr)}</div>`;
  if(view.route==="settings") app.innerHTML = banner + renderSettings();
  else if(view.route==="team") app.innerHTML = banner + renderTeam();
  else if(view.route==="event" && EVENTS[view.evId]) app.innerHTML = banner + renderEvent(EVENTS[view.evId]);
  else if(view.route==="event" && !loaded) app.innerHTML = `<div class="empty">Loading event…</div>`;
  else app.innerHTML = banner + renderDash();
  bind();
}
document.addEventListener("focusout", () => setTimeout(()=>{ if(pendingRender) render(); }, 0));

function unseenMenus(){ return Object.values(EVENTS).filter(e=>!e.cancelled && e.menuChoice?.by==="client" && e.menuChoice?.submittedAt && e.menuSeenAt!==e.menuChoice.submittedAt).sort((a,b)=>(b.menuChoice.submittedAt||"").localeCompare(a.menuChoice.submittedAt||"")); }
function sortedEvents(){ return Object.values(EVENTS).sort((a,b)=> (a.date||"9999").localeCompare(b.date||"9999")); }

function renderDash(){
  const today=todayISO(), in30=addDays(today,30);
  const all = sortedEvents();
  const live = all.filter(e=>!e.cancelled);
  const upcoming = live.filter(e=>e.date && e.date>=today);
  const k = {
    up30: upcoming.filter(e=>e.date<=in30).length,
    sign: live.filter(e=>{const s=stageInfo(e).idx; return s===3||s===4;}).length,
    dep: live.filter(e=>{const s=stageInfo(e).idx; return s===5||s===6;}).length,
    over: live.reduce((a,e)=>a+stageInfo(e).overdue.length,0)
  };
  const q = view.search.trim().toLowerCase();
  let list = all.filter(e => {
    const si=stageInfo(e);
    if(view.filter==="active" && (e.cancelled || si.idx===-1 || (e.date && e.date<addDays(today,-3) ))) return false;
    if(view.filter==="sign" && !(si.idx===3||si.idx===4)) return false;
    if(view.filter==="dep" && !(si.idx===5||si.idx===6)) return false;
    if(view.filter==="over" && !si.overdue.length) return false;
    if(view.filter==="past" && !(e.date && e.date<today)) return false;
    if(view.filter==="cancelled" && !e.cancelled) return false;
    if(q && !(`${e.client?.name} ${e.client?.email} ${e.client?.phone} ${e.type} ${e.area}`.toLowerCase().includes(q))) return false;
    return true;
  });
  if(view.filter==="past") list.reverse();
  const rows = list.map(e => {
    const si=stageInfo(e), d=parseD(e.date);
    const nextTxt = si.next ? `Next: ${esc(si.next.t)}${si.nextDue?" · due "+fmtD(si.nextDue,{day:"numeric",month:"short"}):""}` : "All steps complete";
    const isOver = si.nextDue && si.nextDue < today && !e.cancelled;
    return `<div class="ev-row" data-open="${esc(e.id)}" tabindex="0" role="link">
      <div class="dateblk">${d?`<div class="m">${d.toLocaleDateString("en-AU",{month:"short"})}</div><div class="d">${d.getDate()}</div><div class="w">${d.toLocaleDateString("en-AU",{weekday:"short"})} ${String(d.getFullYear()).slice(2)}</div>`:`<div class="d">?</div>`}</div>
      <div class="ev-main"><div class="t">${esc(e.client?.name||"Unnamed")} · ${esc(e.type||"Event")}</div>
        <div class="s">${esc(timeRange(e))}${e.guests?" · "+esc(e.guests)+" guests":""}${e.area?" · "+esc(e.area):""}</div>
        <div class="next ${isOver?"over":""}">${nextTxt}</div></div>
      <div class="ev-side"><span class="pill ${si.cls}">${si.status}</span>${si.overdue.length?`<span class="pill p-bad">${si.overdue.length} overdue</span>`:""}<span class="next">${money(quote(e).total)}${quote(e).tbc?" + TBC":""}</span></div>
    </div>`;
  }).join("");
  const filters = [["active","Active"],["sign","Awaiting signature"],["dep","Awaiting deposit"],["over","Overdue actions"],["past","Past"],["cancelled","Cancelled"],["all","All"]];
  return `
  <div class="pagehead"><div><h1>Events</h1><p>${new Date().toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long",year:"numeric"})} · ${upcoming.length} upcoming booking${upcoming.length===1?"":"s"}</p></div></div>
  ${(()=>{ const nm=unseenMenus(); return nm.length?`<section class="alerts" aria-live="polite"><h2><span class="xbadge">NEW</span>New menu choices from clients</h2>
    ${nm.map(e=>`<div class="al"><b>${esc(e.client?.name)}</b><span class="hint">${esc(e.type||"")} · ${fmtD(e.date,{day:"numeric",month:"short",year:"numeric"})} · ${esc(menuPackage(e.menuChoice.package)?.name||"")} package${menuExtras(e.menuChoice).length?" + extras":""} · sent ${esc(fmtSyd(e.menuChoice.submittedAt))}</span><button class="btn small primary" data-openmenu="${esc(e.id)}" style="margin-left:auto">Review menu</button></div>`).join("")}</section>`:""; })()}
  <div class="kpis">
    <button class="kpi" data-filter="active"><b>${k.up30}</b><span>Events in the next 30 days</span></button>
    <button class="kpi" data-filter="sign"><b>${k.sign}</b><span>Agreements awaiting signature</span></button>
    <button class="kpi" data-filter="dep"><b>${k.dep}</b><span>Deposits outstanding</span></button>
    <button class="kpi ${k.over?"alert":""}" data-filter="over"><b>${k.over}</b><span>Overdue planning actions</span></button>
  </div>
  <div class="dash">
    <section class="panel">
      <div class="panel-h"><h2>Bookings</h2>
        <div class="filters">
          <input id="search" type="search" placeholder="Search client, email, phone" value="${esc(view.search)}" aria-label="Search">
          <select id="filter" aria-label="Filter">${filters.map(([v,l])=>`<option value="${v}" ${view.filter===v?"selected":""}>${l}</option>`).join("")}</select>
        </div>
      </div>
      ${rows || `<div class="empty">${loaded ? (all.length? "No events match this filter." : "No events yet. Use <b>+ New event</b> to record your first enquiry.") : "Loading…"}</div>`}
    </section>
    <aside class="panel">${renderCal()}</aside>
  </div>`;
}

function renderCal(){
  const base = view.calMonth ? parseD(view.calMonth+"-01") : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const y=base.getFullYear(), m=base.getMonth();
  const first = new Date(y,m,1), startDow=(first.getDay()+6)%7; // Monday first
  const byDate = {};
  Object.values(EVENTS).filter(e=>!e.cancelled && e.date).forEach(e => (byDate[e.date] ||= []).push(e));
  let cells="";
  ["M","T","W","T","F","S","S"].forEach(d=>cells+=`<div class="dow">${d}</div>`);
  const start = new Date(y,m,1-startDow), today=todayISO();
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const iso=toISO(d);
    const evs=byDate[iso]||[];
    const cls=["c", d.getMonth()!==m?"other":"", iso===today?"today":"", evs.length?"has":"", evs.length>1?"clash":""].join(" ");
    cells+=`<div class="${cls}" ${evs.length?`data-open="${esc(evs[0].id)}" title="${esc(evs.map(e=>e.client?.name+" – "+e.type).join(", "))}"`:""}>${d.getDate()}</div>`;
  }
  const monthEvents = Object.values(EVENTS).filter(e=>!e.cancelled && e.date && parseD(e.date).getMonth()===m && parseD(e.date).getFullYear()===y).sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="cal"><div class="cal-h"><button class="btn small ghost" data-cal="-1" aria-label="Previous month">‹</button><h3>${base.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</h3><button class="btn small ghost" data-cal="1" aria-label="Next month">›</button></div>
  <div class="cal-grid">${cells}</div>
  <div class="cal-list">${monthEvents.length? monthEvents.map(e=>`<a href="#event-${esc(e.id)}"><b>${parseD(e.date).getDate()}</b> · ${esc(e.client?.name)} (${esc(e.type)})</a>`).join("") : `<span class="hint">No bookings this month.</span>`}</div>
  <p class="hint" style="margin:10px 0 0">Shaded days are booked; red means two bookings on the same day.</p></div>`;
}

function renderEvent(ev){
  const si=stageInfo(ev), q=quote(ev), today=todayISO();
  const ms=ev.milestones||{};
  const steps = MILESTONES.map((m,i)=>{ const due=msDue(ev,m); const c = ms[m.k]?"done": (due && due<today ? "over" : (i===si.idx?"cur":"")); return `<i class="${c}" title="${esc(m.t)}"></i>`; }).join("");
  const clash = Object.values(EVENTS).filter(o=>o.id!==ev.id && !o.cancelled && o.date && o.date===ev.date);
  const daysTo = ev.date ? daysBetween(today, ev.date) : null;
  const tabs = [["overview","Details"],["quote","Quote"],["catering","Catering"+(ev.menuChoice?.package?(ev.menuLocked?" ✓":" •"):"")],["agreement","Agreement"],["docs","Documents"],["planning","Planning"],["runsheet","Run sheet & vendors"],["payments","Payments"]];
  let body="";
  switch(view.tab){
    case "quote": body=tabQuote(ev,q); break;
    case "agreement": body=tabAgreement(ev,q); break;
    case "docs": body=tabDocs(ev); break;
    case "planning": body=tabPlanning(ev); break;
    case "runsheet": body=tabRunsheet(ev); break;
    case "payments": body=tabPayments(ev,q); break;
    case "catering": body=tabCatering(ev); break;
    default: body=tabOverview(ev);
  }
  return `
  <div class="row" style="margin-bottom:10px"><a href="#events" class="btn small ghost">‹ All events</a><span class="saving" id="saveState" style="margin-left:auto">All changes saved</span></div>
  ${clash.length?`<div class="clashwarn">Another booking is on the same date: ${clash.map(c=>`<a href="#event-${esc(c.id)}">${esc(c.client?.name)} (${esc(c.type)}, ${esc(timeRange(c))})</a>`).join(", ")}. Check areas and times do not overlap (allow one hour between bump-out and bump-in).</div>`:""}
  <div class="ev-head">
    <div><h1>${esc(ev.client?.name||"Unnamed")} — ${esc(ev.type||"Event")}</h1>
    <div class="meta">${fmtD(ev.date)} · ${esc(timeRange(ev))}${ev.guests?" · "+esc(ev.guests)+" guests":""}${ev.area?" · "+esc(ev.area):""}${daysTo!=null && daysTo>=0?` · <b>${daysTo===0?"today":daysTo+" days to go"}</b>`:""}</div></div>
    <div class="right"><span class="pill ${si.cls}">${si.status}</span><span class="pill p-done">${money(q.total)}${q.tbc?" + TBC":""}</span></div>
  </div>
  <div class="stepper" aria-hidden="true">${steps}</div>
  <div class="stepcap">${si.next?`Step ${si.idx+1} of ${MILESTONES.length}: <b>${esc(si.next.t)}</b>${si.nextDue?` · due ${fmtD(si.nextDue)}`:""}`:"All steps complete"}${si.overdue.length?` · <span style="color:var(--bad)">${si.overdue.length} overdue</span>`:""}</div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab ${view.tab===k?"on":""}" data-tab="${k}" role="tab">${l}</button>`).join("")}</div>
  ${body}`;
}

function fld(label, path, val, type="text", extra=""){
  const id = "f_"+path.replace(/\W/g,"_");
  return `<div class="fld ${extra}"><label for="${id}">${label}</label>${
    type==="textarea" ? `<textarea id="${id}" data-k="${path}">${esc(val)}</textarea>` :
    `<input id="${id}" type="${type}" data-k="${path}" value="${esc(val)}">`}</div>`;
}
function tabOverview(ev){
  const c=ev.client||{};
  return `<div class="grid2">
   <section class="panel"><div class="panel-h"><h3>Client (hirer)</h3></div><div class="panel-b form">
     ${fld("Full name","client.name",c.name)}${fld("Phone","client.phone",c.phone,"tel")}
     ${fld("Email","client.email",c.email,"email")}${fld("Address","client.address",c.address,"text","wide")}
   </div></section>
   <section class="panel"><div class="panel-h"><h3>Event</h3></div><div class="panel-b form">
     <div class="fld"><label for="f_type">Type of event</label><select id="f_type" data-k="type">${EVENT_TYPES.map(t=>`<option ${ev.type===t?"selected":""}>${t}</option>`).join("")}</select></div>
     ${fld("Event date","date",ev.date,"date")}
     ${fld("Start time","start",ev.start,"time")}${fld("Finish time","end",ev.end,"time")}
     ${fld("Estimated guests","guests",ev.guests,"number")}${fld("Area(s) hired","area",ev.area)}
     ${fld("Setup access from","setupFrom",ev.setupFrom,"text")}${fld("Enquiry source","source",ev.source)}
   </div></section>
   <section class="panel" style="grid-column:1/-1"><div class="panel-h"><h3>Notes</h3><span class="hint">Requests, decisions, conversations</span></div><div class="panel-b">
     ${fld("","notes",ev.notes,"textarea","wide")}
     <div class="row" style="margin-top:12px">
       ${ev.cancelled?`<button class="btn" data-act="uncancel">Reinstate booking</button>`:`<button class="btn danger" data-act="cancel">Mark as cancelled</button>`}
       <button class="btn danger" data-act="delete">Delete event</button>
       <span class="hint">Cancellation refunds follow clause 6: 60+ days 50% of deposit, 30–59 days 25%, 8–29 days 10%, under 7 days none.</span>
     </div>
   </div></section>
  </div>`;
}

function tabQuote(ev,q){
  const lines=ev.lines||[];
  const rows = lines.map((l,i)=>`<tr>
    <td><input data-line="${i}" data-lf="cat" value="${esc(l.cat)}" aria-label="Service"></td>
    <td><input data-line="${i}" data-lf="loc" value="${esc(l.loc)}" aria-label="Location"></td>
    <td><input data-line="${i}" data-lf="desc" value="${esc(l.desc)}" aria-label="Description"></td>
    <td class="num"><input class="n" data-line="${i}" data-lf="unit" value="${l.unit==null?"":l.unit}" placeholder="TBC" aria-label="Unit price"></td>
    <td class="num"><input class="n" data-line="${i}" data-lf="qty" value="${l.qty==null?"":l.qty}" placeholder="TBC" aria-label="Quantity"></td>
    <td style="text-align:center"><input type="checkbox" data-line="${i}" data-lf="foc" ${l.foc?"checked":""} aria-label="Free of charge"></td>
    <td class="num">${l.foc?"FOC":money(lineTotal(l))}</td>
    <td style="white-space:nowrap"><span class="mv"><button class="btn small ghost" data-linemove="${i}:-1" ${i===0?"disabled":""} aria-label="Move up" title="Move up">↑</button><button class="btn small ghost" data-linemove="${i}:1" ${i===(lines).length-1?"disabled":""} aria-label="Move down" title="Move down">↓</button></span><button class="btn small ghost danger" data-delline="${i}" aria-label="Remove line">✕</button></td></tr>`).join("");
  return `<section class="panel"><div class="panel-h"><h3>Fee proposal</h3>
     <div class="filters"><select id="addCat" aria-label="Add from price list"><option value="">Add from price list…</option>${CATALOG.map((c,i)=>`<option value="${i}">${esc(c.cat)} — ${esc(c.loc||c.desc)} (${c.foc?"FOC":money(c.unit)})</option>`).join("")}</select><button class="btn small" data-act="addline">+ Blank line</button></div></div>
   <div class="panel-b">
     <div class="sum"><div><span>Total (inc GST)</span><b>${money(q.total)}${q.tbc?` <small class="hint">+ ${q.tbc} TBC</small>`:""}</b></div><div><span>Deposit required (25% or $5,000, whichever is higher)</span><b>${money(q.deposit)}</b></div>
     <div class="form" style="flex:1;min-width:260px">${fld("Date issued","dateIssued",ev.dateIssued,"date")}${fld("Valid until","validUntil",ev.validUntil,"date")}</div></div>
     <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Service</th><th>Location</th><th>Description</th><th class="num">Unit (inc GST)</th><th class="num">Qty</th><th>FOC</th><th class="num">Total</th><th></th></tr></thead>
     <tbody>${rows||`<tr><td colspan="8" class="hint">No services yet. Add them from the price list.</td></tr>`}</tbody>
     <tfoot><tr><td colspan="6">Total (inclusive of GST)</td><td class="num">${money(q.total)}</td><td></td></tr></tfoot></table></div>
     <p class="hint">Leave unit price or quantity blank to show TBC on the proposal. TBC lines are left out of the total until filled in. Valid until defaults to 10 business days after the issue date.</p>
   </div></section>`;
}

function emailText(ev,q){
  const first=(ev.client?.name||"").split(" ")[0]||"there";
  return `Dear ${first},

Thank you for considering ${ORG.company} for your ${String(ev.type||"event").toLowerCase()} on ${fmtD(ev.date,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}.

Please find attached our Venue Hire Proposal & Agreement, which sets out the services, estimated costs (${money(q.total)} inc GST${q.tbc?", with some items to be confirmed":""}) and our terms and conditions.

Kind regards,
${ORG.coordName}

${ORG.company}

}

  return `Dear ${first},

Thank you for choosing ${ORG.company} for your ${String(ev.type||"event").toLowerCase()} on ${fmtD(ev.date,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}.

Please review and sign your Venue Hire Proposal & Agreement online using this private link:
${link}

The agreement sets out the services, estimated costs (${money(q.total)} inc GST${q.tbc?", with some items to be confirmed":""}) and our terms and conditions. Signing takes about two minutes on your phone or computer, and you can download a copy straight away.

Please sign by ${fmtD(ev.validUntil||addBusinessDays(todayISO(),10),{day:"numeric",month:"long",year:"numeric"})}. The venue is pencil-booked until then. Once we countersign, we will issue a tax invoice for the deposit of ${money(q.deposit)}; your booking is confirmed when the deposit is received.

To help you plan, your event pack is ready:
• Choose your catering menu online (pick your package and dishes): ${link}#menu${ORG.menuUrl?`
• Catering menu brochure: ${ORG.menuUrl}`:""}${ORG.vendorsUrl?`
• Preferred vendors list: ${ORG.vendorsUrl}`:""}${ORG.photosUrl?`
• Photos from previous events: ${ORG.photosUrl}`:""}

If you have any questions, please contact me on ${ORG.coordPhone}.

Kind regards,
${ORG.coordName}
Shayona Event Coordinator
${ORG.company}
${ORG.coordEmail} | ${ORG.coordPhone}`;
}
/* Email: open a ready-written message in the user's chosen email service */
const EMAIL_VIA = {outlook:"Outlook (Microsoft 365)", owa:"Outlook (alternative link)", gmail:"Gmail", app:"Email app on this computer"};
function emailVia(){ try{ return localStorage.getItem("emailVia") || "outlook"; }catch(e){ return "outlook"; } }
function emailUrl(to, subj, body, via=emailVia()){
  const e = encodeURIComponent;
  if(via==="gmail") return `https://mail.google.com/mail/?view=cm&fs=1&to=${e(to)}&su=${e(subj)}&body=${e(body)}`;
  if(via==="app") return `mailto:${e(to)}?subject=${e(subj)}&body=${e(body)}`;

/* Compare what the client signs: field order, blank vs missing, and "5" vs 5 don't count as changes */
function canon(v){
  if(v===null || v===undefined || v==="") return null;
  if(Array.isArray(v)) return v.map(canon);
  if(typeof v==="object"){ const o={}; Object.keys(v).sort().forEach(k=>{ const c=canon(v[k]); if(c!==null && !(k==="foc" && c===false)) o[k]=c; }); return o; }
  if(typeof v==="number") return String(v);
  if(typeof v==="string" && v.trim()!=="" && !isNaN(Number(v)) && /^-?\d+(\.\d+)?$/.test(v.trim())) return String(Number(v));
  return typeof v==="string" ? v.trim() : v;
}
function sameAgreement(a, b){ const pick = o => { const r={}; SNAP_FIELDS.forEach(k=>{ r[k]=o ? o[k] : undefined; }); return r; }; return JSON.stringify(canon(pick(a)))===JSON.stringify(canon(pick(b))); }
function requestsFor(evId){ return Object.values(SIGNREQ).filter(r=>r.event_id===evId).sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||"")); }
function currentRequest(evId){ return requestsFor(evId).find(r=>r.status!=="void") || null; }

function linkExpiry(ev){
  const minEnd = Date.now()+3*86400000;
  let t = ev.validUntil ? new Date(ev.validUntil+"T23:59:00+11:00").getTime() : 0;
  if(!t || t<minEnd) t = Date.now()+14*86400000;
  return new Date(t).toISOString();
}

function menuPdf(ev){
  const { jsPDF } = window.jspdf; const doc = new jsPDF({unit:"mm", format:"a4"}); const c=ev.menuChoice, pkg=menuPackage(c.package);

  doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
  [[ "Client", ev.client?.name||"" ],[ "Event", `${ev.type||""} · ${fmtD(ev.date)} · ${timeRange(ev)}` ],[ "Area", ev.area||"" ],[ "Package", `${pkg?.name||""} (${pkg?.priceLabel||""})` ],[ "Guests", String(c.guests||"TBC") ],[ "Status", ev.menuLocked?"Finalised":"Not finalised" ]]
    .forEach(([k,v])=>{ doc.setTextColor(100); doc.text(k, 18, y); doc.setTextColor(20); doc.text(String(v), 50, y); y+=6; });
  y+=2;
  const rows=[]; menuGroupsFor(pkg).forEach(g=>{ const v=c.items?.[g.key]||[]; if(v.length) rows.push([g.name, v.join("\n")]); });
  const nPkg = rows.length;
  menuExtras(c).forEach(x=>rows.push([`EXTRA (charged)\n${x.name}`, x.items.join("\n")+`\n— ${x.note}`]));
  const nEx = rows.length;
  if(c.notes) rows.push(["Notes", c.notes]);
  doc.autoTable({ startY:y, margin:{left:18,right:18}, theme:"grid", head:[["Section","Dishes"]], body:rows, styles:{fontSize:10, cellPadding:2.5}, headStyles:{fillColor:[15,27,45]}, columnStyles:{0:{cellWidth:48, fontStyle:"bold"}},
    didParseCell: h => { if(h.section==="body" && h.row.index>=nPkg && h.row.index<nEx){ h.cell.styles.fillColor=[251,238,221]; h.cell.styles.textColor=[150,80,10]; } } });
  return doc.output("blob");
}

}

/* ---------------- Binding ---------------- */
function setPath(obj, path, val){ const ks=path.split("."); let o=obj; ks.slice(0,-1).forEach(k=>{ o[k] = o[k] || {}; o=o[k]; }); o[ks[ks.length-1]]=val; }
function numOrNull(v){ v=String(v).replace(/[$,\s]/g,""); if(v==="") return null; const n=Number(v); return isNaN(n)?null:n; }
function curEv(){ return clone(EVENTS[view.evId]); }

  app.querySelectorAll("[data-emailcopy]").forEach(el=>el.addEventListener("click", ()=>{

  app.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>actions[el.dataset.act]?.(el));

function syncPayMilestones(ev){
  ev.milestones ||= {};
  const dep=(ev.payments||[]).find(p=>p.kind==="Deposit" && p.amount);
  const fin=(ev.payments||[]).find(p=>p.kind==="Final payment" && p.amount);
  if(dep && !ev.milestones.depPaid) ev.milestones.depPaid = dep.date || todayISO();
  if(fin && !ev.milestones.finalPay) ev.milestones.finalPay = fin.date || todayISO();
}

  addpay(){ const ev=curEv(); (ev.payments ||= []).push({date:todayISO(),kind:(ev.milestones?.depPaid?"Final payment":"Deposit"),ref:"",amount:null}); saveEvent(ev); render(); },

  cancel(){ confirmBox("Mark this booking as cancelled? It stays on record and can be reinstated.", ()=>{ const ev=curEv(); ev.cancelled=todayISO(); saveEvent(ev); render(); }); },
  uncancel(){ const ev=curEv(); delete ev.cancelled; saveEvent(ev); render(); },
  delete(){ confirmBox("Delete this event and its planning record permanently? Uploaded files are not deleted.", async()=>{ const id=view.evId; const { error } = await sb.from("events").delete().eq("id", id); if(error){ toast("Could not delete: "+error.message); return; } delete EVENTS[id]; go("#events"); toast("Event deleted"); }); },
  upload(){ pickFile(($("#docKind")||{}).value || "Other"); },

  pdf(btn){
    const msg=$("#pdfMsg");
    if(!window.jspdf){ msg.textContent="The PDF library did not load. Check your connection and reload."; return; }
    try{ const ev=EVENTS[view.evId]; const r=currentRequest(ev.id); saveBlob(buildPdf(ev, ORG, { catalog: CATALOG, signUrl: r ? signLink(r.token) : "" }), pdfName(ev)); msg.textContent="Downloaded."; }
    catch(e){ msg.textContent="Could not create the PDF: "+(e && e.message || e); }
  },
  async createLink(btn){
    const ev=curEv(); btn.disabled=true;
    const snapshot = { event: snapEvent(ev), org: clone(ORG), catalog: clone(CATALOG), stageIdx: 3, generatedAt: new Date().toISOString() };
    const { data, error } = await sb.from("signing_requests").insert({ event_id: ev.id, snapshot, expires_at: linkExpiry(ev), created_by: session.user.id }).select(REQ_COLS).single();
    if(error){ toast("Could not create the link: "+error.message); btn.disabled=false; return; }
    putReq(data);
    ev.milestones ||= {}; const t=todayISO(); ev.milestones.eoi ||= t; ev.milestones.site ||= t; ev.milestones.proposal ||= t;
    saveEvent(ev); toast("Signing link created. Email it to the client."); render();
  },
  voidLink(){
    const r=currentRequest(view.evId);
    confirmBox("Cancel this signing link? The client will no longer be able to open it.", async()=>{
      const { error } = await sb.from("signing_requests").update({status:"void"}).eq("token", r.token).eq("status","sent");
      if(error){ toast(error.message); return; } SIGNREQ[r.token].status="void"; render();
    });
  },
  async dlSigned(){
    const r=currentRequest(view.evId); const full = await fetchReq(r.token); if(!full) return;
    const ev = full.snapshot.event;
    saveBlob(buildPdf(ev, full.snapshot.org, signingOpts(full)), pdfName(ev, full.status==="countersigned"?"SIGNED":"client_signed"));
  },
  countersign(){ openCountersign(); },
  menuEdit(){ staffMenu.editing=true; render(); },
  menuCancel(){ const ev=EVENTS[view.evId]; staffMenu={ evId:ev.id, choice:clone(ev.menuChoice||{guests:ev.guests||""}), dirty:false, editing:false }; render(); },
  menuSave(){
    const ev=curEv(); const ch=clone(staffMenu.choice);
    if(!ch.package){ toast("Choose a package first."); return; }
    const chk=menuCheck(ch); if(chk.over.length){ toast(chk.over[0]); return; }
    ch.by="staff"; ch.submittedAt=new Date().toISOString(); ev.menuChoice=ch;
    if(ch.guests && !ev.guests) ev.guests=ch.guests;
    staffMenu={ evId:ev.id, choice:clone(ch), dirty:false, editing:false };
    saveEvent(ev); toast(chk.complete?"Menu saved.":"Menu saved. Some sections are still incomplete."); render();
  },
  menuLock(){ const ev=curEv(); ev.menuLocked=true; ev.milestones ||= {}; ev.milestones.menu ||= todayISO(); saveEvent(ev); toast("Menu finalised. The client can no longer change it online."); render(); },
  menuUnlock(){ const ev=curEv(); ev.menuLocked=false; saveEvent(ev); toast("Menu reopened for changes."); render(); },
  menuPdf(){ const ev=EVENTS[view.evId]; saveBlob(menuPdf(ev), pdfName(ev,"MENU").replace("Venue_Hire_Agreement_","")); },
  menuToQuote(){
    const ev=curEv(); const c=ev.menuChoice, pkg=menuPackage(c?.package); if(!pkg) return;
    ev.lines ||= []; const guests = c.guests ? Number(c.guests) : null;
    let line = ev.lines.find(l=>/^catering/i.test(l.cat||"") && !/street/i.test(l.desc||""));
    if(!line){ line={cat:"Catering Service", loc:"", foc:false}; ev.lines.push(line); }
    Object.assign(line, { desc:`${pkg.name} menu package, as selected (per person)`, unit: pkg.price, qty: guests });
    line = null;
    // remove old extra lines, then add one line per extra chosen
    ev.lines = ev.lines.filter(l=>!(/^catering extra/i.test(l.cat||"") || (/^catering/i.test(l.cat||"") && /street food add-on/i.test(l.desc||""))));

    saveEvent(ev); toast("Catering added to the quote. Check it on the Quote tab."); render();
  }
};

function saveBlob(blob, name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
async function fetchReq(token){
  const { data, error } = await sb.from("signing_requests").select("*").eq("token", token).single();
  if(error){ toast("Could not load the signed record: "+error.message); return null; } return data;
}
async function uploadToEvent(evId, blob, name, kind){
  const path = `${evId}/${Date.now()}_${name.replace(/[^A-Za-z0-9._-]+/g,"_")}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || "application/octet-stream", upsert:false });
  if(error) throw error;
  return { id:path, name, kind, at:new Date().toISOString(), size: blob.size };
}

function openCountersign(){
  const r=currentRequest(view.evId);
  modal(`<h2>Countersign agreement</h2><p class="hint">Signed by ${esc(r.signer_name)} on ${esc(fmtSyd(r.signed_at))}. Your signature completes the agreement.</p>
    <div class="form"><div class="fld"><label for="cs_name">Name</label><input id="cs_name" value="${esc(ORG.signName||me.full_name)}"></div><div class="fld"><label for="cs_title">Title</label><input id="cs_title" value="${esc(ORG.signTitle)}"></div></div>
    <div style="margin-top:12px" id="cs_pad"></div>
    <div class="acts"><button class="btn" id="cs_no">Cancel</button><button class="btn primary" id="cs_ok">Countersign &amp; save</button></div>`, root=>{
    const pad = makeSigPad($("#cs_pad",root)); pad.setName($("#cs_name",root).value);
    $("#cs_no",root).onclick=closeModal;
    $("#cs_ok",root).onclick=async()=>{
      const name=$("#cs_name",root).value.trim(), title=$("#cs_title",root).value.trim();
      if(!name){ toast("Enter your name."); return; } if(pad.isEmpty()){ toast("Add your signature."); return; }
      const btn=$("#cs_ok",root); btn.disabled=true; btn.textContent="Saving…";
      const sig = pad.toDataURL();
      const { data, error } = await sb.from("signing_requests").update({ staff_name:name, staff_title:title, staff_signature:sig, countersigned_at:new Date().toISOString(), countersigned_by:session.user.id, status:"countersigned" }).eq("token", r.token).eq("status","signed").select("*").single();
      if(error){ toast("Could not countersign: "+error.message); btn.disabled=false; btn.textContent="Countersign & save"; return; }
      putReq(data);
      try{
        const evS = data.snapshot.event;
        const blob = buildPdf(evS, data.snapshot.org, signingOpts(data));
        const doc = await uploadToEvent(view.evId, blob, pdfName(evS,"SIGNED"), "Signed agreement");
        const ev=curEv(); (ev.docs ||= []).push(doc); ev.milestones ||= {}; ev.milestones.hirerSigned ||= sydDateISO(data.signed_at); ev.milestones.countersigned = todayISO();
        saveEvent(ev); toast("Agreement fully signed and saved to Documents.");
      }catch(e){ toast("Countersigned, but the PDF could not be saved: "+(e.message||e)+". Use Download to get it."); }
      closeModal(); render();
    };
  });
}

function pickFile(kind, markSigned){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".pdf,image/*,.docx,.xlsx,.csv,.txt,.doc,.xls";
  inp.onchange=async()=>{
    const file=inp.files[0]; if(!file) return;
    if(file.size>50*1024*1024){ toast("Files must be under 50 MB."); return; }
    toast("Uploading "+file.name+"…");
    try{
      const doc = await uploadToEvent(view.evId, file, file.name, kind);
      const ev=curEv(); (ev.docs ||= []).push(doc);
      if(markSigned){ ev.milestones ||= {}; ev.milestones.hirerSigned ||= todayISO(); }
      saveEvent(ev); toast("Uploaded "+file.name); render();
    }catch(e){ toast("Upload failed: "+(e && e.message || "try again")); }
  };
  inp.click();
}

function pickResource(key){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/pdf,.pdf";
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    if(f.size>25*1024*1024){ toast("PDFs must be under 25 MB."); return; }
    toast("Uploading "+f.name+"…");
    const path = `${key.replace("Url","")}/${Date.now()}_${f.name.replace(/[^A-Za-z0-9._-]+/g,"_")}`;
    const { error } = await sb.storage.from("client-resources").upload(path, f, { contentType:"application/pdf", upsert:false });
    if(error){ toast("Upload failed: "+error.message+(/bucket/i.test(error.message)?" (run 05_menu_and_event_pack.sql in Supabase)":"")); return; }
    const { data } = sb.storage.from("client-resources").getPublicUrl(path);
    ORG[key] = data.publicUrl; saveSettings(); toast("Uploaded. New agreements will include it."); render();
  };
  inp.click();
}

/* ---------------- Modals ---------------- */
// Windows close only with their Cancel/Close buttons, so typed data isn't lost by a stray click.
function modal(html, onMount){ const r=$("#modalRoot"); r.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; onMount && onMount(r); }
function closeModal(){ $("#modalRoot").innerHTML=""; if(pendingRender) render(); }
function confirmBox(text, ok){ modal(`<h2>Please confirm</h2><p>${esc(text)}</p><div class="acts"><button class="btn" id="cNo">Cancel</button><button class="btn primary" id="cYes">Confirm</button></div>`, r=>{ $("#cNo",r).onclick=closeModal; $("#cYes",r).onclick=()=>{ closeModal(); ok(); }; }); }

function openNewEvent(){
  modal(`<h2>New event enquiry</h2><form id="nf" class="form">
    <div class="fld"><label for="n_name">Client name</label><input id="n_name" required></div>
    <div class="fld"><label for="n_phone">Phone</label><input id="n_phone" type="tel"></div>
    <div class="fld"><label for="n_email">Email</label><input id="n_email" type="email"></div>
    <div class="fld"><label for="n_type">Type of event</label><select id="n_type">${EVENT_TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div>
    <div class="fld"><label for="n_date">Event date</label><input id="n_date" type="date" required></div>
    <div class="fld"><label for="n_guests">Estimated guests</label><input id="n_guests" type="number" min="0"></div>
    <div class="fld"><label for="n_start">Start time</label><input id="n_start" type="time"></div>
    <div class="fld"><label for="n_end">Finish time</label><input id="n_end" type="time"></div>
    <div class="fld wide"><label for="n_area">Area(s) of interest</label><input id="n_area" placeholder="e.g. Outdoor Central Courtyard (West)"></div>
    <div class="fld wide" id="n_clash"></div>
  </form><div class="acts"><button class="btn" id="nCancel">Cancel</button><button class="btn primary" id="nSave">Create event</button></div>`, r=>{
    $("#n_name",r).focus();
    $("#n_date",r).onchange=()=>{ const d=$("#n_date",r).value; const c=Object.values(EVENTS).filter(e=>!e.cancelled && e.date===d); $("#n_clash",r).innerHTML = c.length?`<div class="clashwarn">Already booked that day: ${c.map(e=>esc(e.client?.name+" ("+e.type+", "+(e.area||"area TBC")+")")).join(", ")}</div>`:""; };
    $("#nCancel",r).onclick=closeModal;
    const save=()=>{
      const name=$("#n_name",r).value.trim(), date=$("#n_date",r).value;
      if(!name || !date){ toast("Client name and event date are needed."); return; }
      const id=uid("ev"), t=todayISO();
      const ev={id, createdAt:new Date().toISOString(), client:{name, phone:$("#n_phone",r).value.trim(), email:$("#n_email",r).value.trim(), address:""},
        type:$("#n_type",r).value, date, start:$("#n_start",r).value, end:$("#n_end",r).value, guests:$("#n_guests",r).value?Number($("#n_guests",r).value):"",
        area:$("#n_area",r).value.trim(), lines:[], milestones:{eoi:t}, compliance:{}, tasks:[], runsheet:[], vendors:[], payments:[], docs:[], dateIssued:t, validUntil:addBusinessDays(t,10)};
      const pc = CATALOG.find(c=>/clean/i.test(c.cat)); if(pc) ev.lines.push({cat:pc.cat,loc:pc.loc,desc:pc.desc,unit:pc.unit,qty:1,foc:false});
      saveEvent(ev); closeModal(); view.evId=id; view.tab="quote"; go("#event-"+id);
    };
    $("#nSave",r).onclick=save; $("#nf",r).onsubmit=e=>{ e.preventDefault(); save(); };
  });
}


/* ---------------- Boot ---------------- */

const REQ_COLS = "token,event_id,status,created_at,expires_at,viewed_at,signer_name,signer_email,signed_at,staff_name,countersigned_at,snapshot";
function putReq(row){ const { signature, staff_signature, snapshot, ...rest } = row; SIGNREQ[row.token] = { ...(SIGNREQ[row.token]||{}), ...rest, snapshot_event: snapshot?.event ?? SIGNREQ[row.token]?.snapshot_event }; }

/* ---------------- Team (admin) ---------------- */
async function loadTeam(){
  const [p, i] = await Promise.all([ sb.from("profiles").select("*").order("email"), sb.from("staff_invites").select("*").order("email") ]);
  TEAM = { profiles: p.data||[], invites: (i.data||[]).filter(x=>!(p.data||[]).some(y=>y.email===x.email && y.active)) };
  render();
}
async function teamSet(id, role, active){
  const pr = TEAM.profiles.find(x=>x.id===id); if(!pr) return;
  const { error } = await sb.rpc("set_staff_access", { p_id:id, p_role: role ?? pr.role, p_active: active ?? pr.active });
  if(error) toast(error.message); else toast("Access updated");
  loadTeam();
}
function renderTeam(){
  if(!isAdmin()) return `<div class="empty">Only admins can manage the team.</div>`;
  return `<div class="pagehead"><div><h1>Team</h1><p>Who can sign in and manage events.</p></div></div><div class="stack">
  <section class="panel"><div class="panel-h"><h2>Invite a coordinator</h2></div><div class="panel-b">
    <form id="inviteForm" class="row"><input id="invEmail" type="email" placeholder="name@example.org" required style="flex:1;min-width:220px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)" aria-label="Email">
    <select id="invRole" style="padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)" aria-label="Role"><option value="coordinator">Coordinator</option><option value="admin">Admin</option></select>
    <button class="btn primary" type="submit">Invite</button></form>
    <p class="hint">After inviting, ask them to open this site and choose <b>Create account</b> with the same email. Coordinators manage events; admins can also change settings, prices and the team.</p>
  </div></section>
  <section class="panel"><div class="panel-h"><h2>Team</h2></div><div class="panel-b tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th></tr></thead><tbody>
    ${TEAM.profiles.map(pr=>`<tr><td>${esc(pr.full_name||"—")}</td><td>${esc(pr.email)}</td>
      <td><select data-role="${pr.id}" ${pr.id===me.id?"disabled":""} aria-label="Role"><option value="coordinator" ${pr.role==="coordinator"?"selected":""}>Coordinator</option><option value="admin" ${pr.role==="admin"?"selected":""}>Admin</option></select></td>
      <td><input type="checkbox" data-active="${pr.id}" ${pr.active?"checked":""} ${pr.id===me.id?"disabled":""} aria-label="Active"></td></tr>`).join("") || `<tr><td colspan="4" class="hint">Loading…</td></tr>`}
  </tbody></table>
  ${TEAM.invites.length?`<h3 style="margin-top:16px">Invited, not signed up yet</h3>${TEAM.invites.map(i=>`<div class="row" style="padding:6px 0"><span>${esc(i.email)}</span><span class="pill p-enq">${esc(i.role)}</span><button class="btn small ghost danger" data-uninvite="${esc(i.email)}">Remove</button></div>`).join("")}`:""}
  <p class="hint">Unticking Active removes that person's access straight away.</p></div></section></div>`;
}

/* ---------------- Sign-in ---------------- */
function authScreen(mode="in", msg=""){
  $("#mainNav").hidden = true; document.body.classList.remove("authed");
  const titles = {in:"Sign in", up:"Create account", forgot:"Reset password", reset:"Choose a new password"};
  $("#app").innerHTML = `<div class="auth"><div class="mark" aria-hidden="true">S</div><h2>${titles[mode]}</h2><p class="hint">${mode==="up"?"Use the email address an admin invited.":mode==="forgot"?"We'll email you a link to set a new password.":mode==="reset"?"Enter a new password for your account.":"Mandir Event Manager — staff access"}</p>
    ${msg?`<div class="banner">${esc(msg)}</div>`:""}
    <form id="authForm" class="form">
      ${mode==="up"?`<div class="fld"><label for="a_name">Full name</label><input id="a_name" required autocomplete="name"></div>`:""}
      ${mode!=="reset"?`<div class="fld"><label for="a_email">Email</label><input id="a_email" type="email" required autocomplete="email"></div>`:""}
      ${mode!=="forgot"?`<div class="fld"><label for="a_pw">Password</label><input id="a_pw" type="password" required minlength="8" autocomplete="${mode==="in"?"current-password":"new-password"}"></div>`:""}
      <button class="btn primary" type="submit" style="justify-content:center">${titles[mode]}</button>
    </form>
    <div class="links">${mode==="in"?`<button data-m="up">Create account</button><button data-m="forgot">Forgot password?</button>`:mode!=="reset"?`<button data-m="in">Back to sign in</button>`:""}</div></div>`;
  document.querySelectorAll(".auth [data-m]").forEach(b=>b.onclick=()=>authScreen(b.dataset.m));
  $("#authForm").onsubmit = async e => {
    e.preventDefault(); const btn=e.target.querySelector("button[type=submit]"); btn.disabled=true;
    const email=$("#a_email")?.value.trim(), pw=$("#a_pw")?.value;
    let res;
    if(mode==="in") res = await sb.auth.signInWithPassword({ email, password:pw });
    else if(mode==="up") res = await sb.auth.signUp({ email, password:pw, options:{ data:{ full_name:$("#a_name").value.trim() }, emailRedirectTo: location.origin+location.pathname } });
    else if(mode==="forgot") res = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin+location.pathname });
    else res = await sb.auth.updateUser({ password:pw });
    btn.disabled=false;
    if(res.error){ authScreen(mode, res.error.message); return; }
    if(mode==="in"){ $("#app").innerHTML = `<div class="empty">Signing in…</div>`; start(); }
    else if(mode==="up" && !res.data.session) authScreen("in", "Account created. Check your email to confirm it, then sign in.");
    else if(mode==="up") start();
    else if(mode==="forgot") authScreen("in", "If that email has an account, a reset link is on its way.");
    else if(mode==="reset"){ toast("Password updated"); start(); }
  };
}

/* ---------------- Boot ---------------- */
async function start(){
  try{ await startInner(); }
  catch(e){ $("#mainNav").hidden = true; document.body.classList.remove("authed"); $("#app").innerHTML = `<div class="auth"><h2>Couldn't load the system</h2><p>${esc(e && e.message || String(e))}</p><p class="hint">Check your internet connection and reload (Ctrl+Shift+R). If this keeps happening, send this message to your administrator.</p><button class="btn" onclick="location.reload()">Reload</button></div>`; }
}
async function startInner(){
  const { data:{ session:s } } = await sb.auth.getSession();
  session = s;
  if(!session){ authScreen("in"); return; }
  const { data:prof, error:profErr } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if(profErr) throw new Error("Could not read your staff profile: "+profErr.message+". Make sure 01_schema.sql has been run in Supabase.");
  me = prof;
  if(!me || !me.active){
    $("#mainNav").hidden = true; document.body.classList.remove("authed");
    $("#app").innerHTML = `<div class="auth"><h2>Waiting for access</h2><p>You're signed in as <b>${esc(session.user.email)}</b>, but this account hasn't been given access yet.</p><p class="hint">Ask an admin to invite this email address under Team, then sign in again.</p><button class="btn" id="outBtn">Sign out</button></div>`;
    $("#outBtn").onclick = async()=>{ await sb.auth.signOut(); location.reload(); };
    return;
  }
  $("#mainNav").hidden = false; document.body.classList.add("authed"); $("#navTeam").hidden = !isAdmin();
  $("#whoName").textContent = me.full_name || me.email;
  $("#whoAv").textContent = (me.full_name||me.email||"?").split(/[\s@.]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
  $("#app").innerHTML = `<div class="empty">Loading events…</div>`;
  const [ev, st, rq] = await Promise.all([
    sb.from("events").select("id,data"),
    sb.from("app_settings").select("data").eq("id","org").maybeSingle(),
    sb.from("signing_requests").select(REQ_COLS).neq("status","void").order("created_at",{ascending:false}).limit(1000)
  ]);
  if(ev.error){ loadErr = "Could not load events: "+ev.error.message; }
  EVENTS = {}; (ev.data||[]).forEach(r=>{ EVENTS[r.id] = { ...r.data, id:r.id }; });
  if(st.data?.data){ const v=st.data.data; if(v.org) ORG={...DEFAULT_ORG, ...v.org}; if(Array.isArray(v.catalog)) CATALOG=v.catalog; }
  SIGNREQ = {}; (rq.data||[]).forEach(putReq);
  loaded = true; route();
  // live updates from other coordinators and from client signing
  sb.channel("live")
    .on("postgres_changes", { event:"*", schema:"public", table:"events" }, p => {
      if(p.eventType==="DELETE"){ delete EVENTS[p.old.id]; }
      else { const id=p.new.id; if(writeQ["events/"+id]?.busy) return; const was=EVENTS[id]?.menuChoice?.submittedAt; EVENTS[id] = { ...p.new.data, id };
        const mc=p.new.data?.menuChoice; if(mc && mc.by==="client" && mc.submittedAt!==was) toast(`${p.new.data.client?.name||"A client"} has sent their catering menu choice`); }
      render();
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"signing_requests" }, p => {
      if(p.eventType==="DELETE") delete SIGNREQ[p.old.token]; else { const before = SIGNREQ[p.new.token]?.status; putReq(p.new); if(before==="sent" && p.new.status==="signed") toast(`${p.new.signer_name} has signed their agreement`); }
      render();
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"app_settings" }, p => { const v=p.new?.data; if(v){ if(v.org) ORG={...DEFAULT_ORG, ...v.org}; if(Array.isArray(v.catalog)) CATALOG=v.catalog; render(); } })
    .subscribe();
}

(function init(){
  if(!window.supabase || !CFG.SUPABASE_URL || /YOUR-PROJECT/.test(CFG.SUPABASE_URL)){
    $("#app").innerHTML = `<div class="auth"><h2>Setup needed</h2><p>Add your Supabase project URL and anon key to <code>config.js</code>, then redeploy.</p></div>`; return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((evt) => { if(evt==="PASSWORD_RECOVERY") authScreen("reset"); });
  if(/type=recovery/.test(location.hash)) return; // onAuthStateChange shows the reset form
  start();
})();

</script>
